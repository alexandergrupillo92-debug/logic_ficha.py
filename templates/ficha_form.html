<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ficha de Avance de Obra - Alcaldía de Brión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; font-size: 14px; }
        .card-header { background-color: #1e508c; color: white; font-weight: bold; }
        .btn-custom { background-color: #1e508c; color: white; font-weight: bold; }
        .btn-custom:hover { background-color: #153a66; color: white; }
    </style>
</head>
<body>
<div class="container py-3" style="max-width: 650px;">
    <div class="card shadow-sm border-0 mb-4">
        <div class="card-header text-center py-3">
            <h5 class="m-0">ALCALDÍA DEL MUNICIPIO BRIÓN</h5>
            <small>Ficha Técnica y Reporte de Avance de Obra</small>
        </div>
        <div class="card-body">
            <form action="/generar_pdf" method="POST" enctype="multipart/form-data">
                
                <!-- DIRECCIÓN EMISORA -->
                <div class="mb-3">
                    <label class="form-label fw-bold">Dirección Emisora:</label>
                    <select name="direccion" class="form-select" required>
                        <option value="Dirección de Hábitat y Vivienda">Dirección de Hábitat y Vivienda</option>
                        <option value="Dirección de Ingeniería Municipal">Dirección de Ingeniería Municipal</option>
                    </select>
                </div>

                <!-- I. DATOS GENERALES -->
                <h6 class="fw-bold border-bottom pb-1 text-primary">I. Datos Generales y Ubicación</h6>
                
                <div class="mb-2">
                    <label class="form-label">Propietario / Beneficiario:</label>
                    <input type="text" name="propietario" class="form-control" placeholder="Nombre y Apellido" required>
                </div>

                <div class="row">
                    <div class="col-6 mb-2">
                        <label class="form-label">Cédula:</label>
                        <input type="text" name="cedula" class="form-control" placeholder="V-12345678" required>
                    </div>
                    <div class="col-6 mb-2">
                        <label class="form-label">Teléfono:</label>
                        <input type="text" name="telefono" class="form-control" placeholder="0412-0000000" required>
                    </div>
                </div>

                <div class="mb-2">
                    <label class="form-label">Vivienda / Dirección Exacta:</label>
                    <input type="text" name="direccion_vivienda" class="form-control" placeholder="Vereda / Casa / Sector" required>
                </div>

                <div class="row">
                    <div class="col-6 mb-2">
                        <label class="form-label">Parroquia:</label>
                        <select name="parroquia" class="form-select">
                            <option value="Higuerote">Higuerote</option>
                            <option value="Curiepe">Curiepe</option>
                            <option value="Tacarigua">Tacarigua</option>
                        </select>
                    </div>
                    <div class="col-6 mb-2">
                        <label class="form-label">Tipología:</label>
                        <select name="tipologia" class="form-select">
                            <option value="Unifamiliar">Unifamiliar</option>
                            <option value="Bifamiliar">Bifamiliar</option>
                            <option value="Multifamiliar">Multifamiliar</option>
                            <option value="Comercial">Comercial</option>
                        </select>
                    </div>
                </div>

                <div class="row">
                    <div class="col-6 mb-2">
                        <label class="form-label">Tecnología Constructiva:</label>
                        <select name="tecnologia" class="form-select">
                            <option value="Kit Estructural">Kit Estructural</option>
                            <option value="Concreto Armado">Concreto Armado</option>
                            <option value="Estructura Aporticada">Estructura Aporticada</option>
                        </select>
                    </div>
                    <div class="col-6 mb-2">
                        <label class="form-label">Fecha:</label>
                        <input type="date" name="fecha" class="form-control" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Coordenadas GPS (Lat, Long):</label>
                    <input type="text" name="gps" class="form-control" placeholder="10.461077, -66.175162">
                </div>

                <!-- II. TABLA DE AVANCE FÍSICO -->
                <h6 class="fw-bold border-bottom pb-1 text-primary mt-4">II. Avance Físico por Capítulo (%)</h6>

                <div class="mb-2 row align-items-center"><label class="col-8 col-form-label">1. Preliminares (5%):</label><div class="col-4"><input type="number" name="avance_1" class="form-control" min="0" max="100" value="0"></div></div>
                <div class="mb-2 row align-items-center"><label class="col-8 col-form-label">2. Infraestructura (15%):</label><div class="col-4"><input type="number" name="avance_2" class="form-control" min="0" max="100" value="0"></div></div>
                <div class="mb-2 row align-items-center"><label class="col-8 col-form-label">3. Superestructura (15%):</label><div class="col-4"><input type="number" name="avance_3" class="form-control" min="0" max="100" value="0"></div></div>
                <div class="mb-2 row align-items-center"><label class="col-8 col-form-label">4. Paredes y Marcos (15%):</label><div class="col-4"><input type="number" name="avance_4" class="form-control" min="0" max="100" value="0"></div></div>
                <div class="mb-2 row align-items-center"><label class="col-8 col-form-label">5. Inst. Sanit/Eléct. (10%):</label><div class="col-4"><input type="number" name="avance_5" class="form-control" min="0" max="100" value="0"></div></div>
                <div class="mb-2 row align-items-center"><label class="col-8 col-form-label">6. Cubiertas y Techos (10%):</label><div class="col-4"><input type="number" name="avance_6" class="form-control" min="0" max="100" value="0"></div></div>
                <div class="mb-2 row align-items-center"><label class="col-8 col-form-label">7. Revestimientos (15%):</label><div class="col-4"><input type="number" name="avance_7" class="form-control" min="0" max="100" value="0"></div></div>
                <div class="mb-2 row align-items-center"><label class="col-8 col-form-label">8. Acabados Finales (10%):</label><div class="col-4"><input type="number" name="avance_8" class="form-control" min="0" max="100" value="0"></div></div>

                <!-- III. OBSERVACIONES GENERALES -->
                <h6 class="fw-bold border-bottom pb-1 text-primary mt-4">III. Observaciones Generales</h6>
                <div class="mb-3">
                    <textarea name="observaciones" class="form-control" rows="3" placeholder="Detalles de los trabajos ejecutados e inspeccionados..."></textarea>
                </div>

                <!-- IV. REGISTRO FOTOGRÁFICO -->
                <h6 class="fw-bold border-bottom pb-1 text-primary mt-4">IV. Registro Fotográfico (Hasta 4 fotos)</h6>
                
                <div class="border rounded p-2 mb-2 bg-light">
                    <label class="form-label fw-bold">Foto 1</label>
                    <input type="file" name="foto_1" class="form-control mb-1" accept="image/*">
                    <input type="text" name="desc_foto_1" class="form-control form-control-sm" placeholder="Descripción de la Foto 1">
                </div>
                <div class="border rounded p-2 mb-2 bg-light">
                    <label class="form-label fw-bold">Foto 2</label>
                    <input type="file" name="foto_2" class="form-control mb-1" accept="image/*">
                    <input type="text" name="desc_foto_2" class="form-control form-control-sm" placeholder="Descripción de la Foto 2">
                </div>
                <div class="border rounded p-2 mb-2 bg-light">
                    <label class="form-label fw-bold">Foto 3</label>
                    <input type="file" name="foto_3" class="form-control mb-1" accept="image/*">
                    <input type="text" name="desc_foto_3" class="form-control form-control-sm" placeholder="Descripción de la Foto 3">
                </div>
                <div class="border rounded p-2 mb-2 bg-light">
                    <label class="form-label fw-bold">Foto 4</label>
                    <input type="file" name="foto_4" class="form-control mb-1" accept="image/*">
                    <input type="text" name="desc_foto_4" class="form-control form-control-sm" placeholder="Descripción de la Foto 4">
                </div>

                <button type="submit" class="btn btn-custom w-100 py-3 mt-3 shadow-sm">📄 GENERAR FICHA PDF</button>
            </form>
        </div>
    </div>
</div>
</body>
  </html>
